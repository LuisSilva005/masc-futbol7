<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MASC · Fútbol 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --green: #00C170;
  --green-dark: #009954;
  --green-dim: rgba(0,193,112,0.12);
  --red: #FF4545;
  --red-dim: rgba(255,69,69,0.12);
  --yellow: #FFD600;
  --yellow-dim: rgba(255,214,0,0.12);
  --bg: #0D0D0D;
  --bg2: #161616;
  --bg3: #1E1E1E;
  --bg4: #272727;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.14);
  --text: #F0F0F0;
  --text2: #888;
  --text3: #555;
  --radius: 10px;
  --radius-lg: 16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}

/* HEADER */
header{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100}
.logo{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:var(--green)}
.logo span{color:var(--text2);font-size:14px;font-family:'DM Sans',sans-serif;font-weight:400;letter-spacing:0;margin-left:8px;vertical-align:middle}
.header-meta{font-size:12px;color:var(--text3)}

/* NAV */
nav{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch}
nav::-webkit-scrollbar{display:none}
.nav-btn{flex:1;min-width:80px;padding:12px 8px;border:none;background:none;color:var(--text2);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:6px}
.nav-btn svg{width:16px;height:16px;flex-shrink:0}
.nav-btn.active{color:var(--green);border-bottom-color:var(--green)}
.nav-btn:hover:not(.active){color:var(--text);background:rgba(255,255,255,0.04)}

/* MAIN */
main{max-width:720px;margin:0 auto;padding:20px 16px 40px}
.section{display:none}.section.active{display:block}

/* JORNADA NAV */
.j-nav{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.j-info{flex:1}
.j-num{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:1px;line-height:1}
.j-date{font-size:13px;color:var(--text2);margin-top:2px}
.icon-btn{width:34px;height:34px;border:1px solid var(--border2);border-radius:8px;background:var(--bg3);color:var(--text2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;flex-shrink:0}
.icon-btn:hover{border-color:var(--green);color:var(--green)}
.btn{padding:8px 16px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg3);color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--green);color:var(--green)}
.btn-green{background:var(--green);border-color:var(--green);color:#000}
.btn-green:hover{background:var(--green-dark);border-color:var(--green-dark);color:#000}

/* PARTIDO CARD */
.partido-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:16px}
.partido-scores{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-bottom:12px}
.team-side{display:flex;flex-direction:column;gap:6px}
.team-side.away{align-items:flex-end}
.team-name-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
.score-box{display:flex;align-items:center;gap:8px}
.score-in{width:52px;height:52px;border:1px solid var(--border2);border-radius:10px;background:var(--bg3);color:var(--text);font-family:'Bebas Neue',sans-serif;font-size:32px;text-align:center;outline:none;transition:border-color .2s}
.score-in:focus{border-color:var(--green)}
.vs-tag{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--text3);letter-spacing:1px}
.rival-in{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg3);color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;transition:border-color .2s}
.rival-in:focus{border-color:var(--green)}
.rival-in::placeholder{color:var(--text3)}
.nota-in{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg3);color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;margin-top:8px;transition:border-color .2s;resize:none;height:40px}
.nota-in:focus{border-color:var(--border2)}
.nota-in::placeholder{color:var(--text3)}
.result-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.04em;margin-top:8px}
.rb-win{background:var(--green-dim);color:var(--green)}
.rb-draw{background:rgba(255,255,255,0.08);color:var(--text2)}
.rb-loss{background:var(--red-dim);color:var(--red)}

/* TABLE */
.section-label{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;margin-top:4px}
.stats-table{width:100%;border-collapse:collapse}
.stats-table th{font-size:11px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:6px 8px;text-align:center;border-bottom:1px solid var(--border)}
.stats-table th:first-child{text-align:left;padding-left:4px}
.stats-table td{padding:10px 8px;border-bottom:1px solid var(--border);text-align:center;vertical-align:middle}
.stats-table td:first-child{text-align:left;padding-left:4px}
.stats-table tr:last-child td{border-bottom:none}
.stats-table tbody tr{transition:background .15s}
.stats-table tbody tr:hover{background:rgba(255,255,255,0.03)}

/* PLAYER NAME CELL */
.player-cell{display:flex;align-items:center;gap:10px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--green);flex-shrink:0;border:1px solid var(--border)}
.player-name{font-size:14px;font-weight:500}

/* TOGGLE */
.tog{width:38px;height:22px;border-radius:11px;border:none;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0}
.tog.on{background:var(--green)}.tog.off{background:var(--bg4);border:1px solid var(--border2)}
.tog::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;transition:left .2s}
.tog.on::after{left:19px}.tog.off::after{left:2px}

/* NUMBER INPUT */
.num-in{width:44px;padding:5px 4px;border:1px solid var(--border);border-radius:8px;background:var(--bg3);color:var(--text);font-size:14px;text-align:center;outline:none;transition:border-color .2s}
.num-in:focus{border-color:var(--green)}

/* TOTALES */
.totales-bar{display:flex;gap:16px;padding:12px 0 0;border-top:1px solid var(--border);margin-top:4px;font-size:13px;color:var(--text2)}
.tot-item{display:flex;align-items:center;gap:6px}
.tot-dot{width:8px;height:8px;border-radius:50%}

/* METRICS */
.metrics-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
@media(max-width:400px){.metrics-grid{grid-template-columns:repeat(2,1fr)}}
.metric-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 12px;text-align:center}
.metric-val{font-family:'Bebas Neue',sans-serif;font-size:36px;color:var(--text);line-height:1}
.metric-val.green{color:var(--green)}
.metric-val.red{color:var(--red)}
.metric-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}

/* RANKING */
.rank-num{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--text3);width:24px}
.rank-num.top{color:var(--green)}

/* HISTORIAL */
.h-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:border-color .2s}
.h-card:hover{border-color:var(--border2)}
.h-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.h-jnum{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.5px}
.h-date{font-size:12px;color:var(--text3)}
.h-score{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1px;margin-bottom:6px}
.h-meta{display:flex;gap:14px;font-size:12px;color:var(--text2)}
.h-meta span{display:flex;align-items:center;gap:4px}

/* PLANTEL */
.pos-select{padding:5px 8px;border:1px solid var(--border);border-radius:8px;background:var(--bg3);color:var(--text);font-size:13px;outline:none;cursor:pointer}
.status-badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.sb-active{background:var(--green-dim);color:var(--green)}
.sb-inactive{background:rgba(255,255,255,0.06);color:var(--text3)}
.name-edit{background:none;border:none;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;width:90px;outline:none;border-bottom:1px solid transparent;transition:border-color .2s}
.name-edit:focus{border-bottom-color:var(--green)}

/* SAVE INDICATOR */
.save-dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;margin-left:6px;opacity:0;transition:opacity .3s}
.save-dot.show{opacity:1}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* EMPTY */
.empty-state{text-align:center;padding:40px 20px;color:var(--text3);font-size:14px}

/* RESPONSIVE TWEAKS */
@media(max-width:480px){
  .score-in{width:46px;height:46px;font-size:28px}
  .stats-table th:nth-child(5),.stats-table td:nth-child(5),
  .stats-table th:nth-child(6),.stats-table td:nth-child(6){display:none}
}
</style>
</head>
<body>

<header>
  <div class="logo">MASC <span>Fútbol 7</span></div>
  <div class="header-meta" id="header-meta">Temporada 2025</div>
</header>

<nav>
  <button class="nav-btn active" onclick="showTab('jornada',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    Jornada
  </button>
  <button class="nav-btn" onclick="showTab('tabla',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    Tabla
  </button>
  <button class="nav-btn" onclick="showTab('plantel',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    Plantel
  </button>
  <button class="nav-btn" onclick="showTab('historial',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    Historial
  </button>
</nav>

<main>

<!-- JORNADA -->
<div id="tab-jornada" class="section active">
  <div class="j-nav">
    <div class="j-info">
      <div class="j-num" id="j-num">JORNADA 1</div>
      <div class="j-date" id="j-date">Domingo 24 de mayo 2025</div>
    </div>
    <button class="icon-btn" onclick="prevJ()" title="Anterior">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button class="icon-btn" onclick="nextJ()" title="Siguiente">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <button class="btn" onclick="addJornada()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Nueva
    </button>
  </div>

  <div class="partido-card">
    <div class="partido-scores">
      <div class="team-side">
        <div class="team-name-label">MASC</div>
        <input class="score-in" type="number" min="0" id="score-home" placeholder="—" oninput="saveScore()">
      </div>
      <div class="vs-tag">VS</div>
      <div class="team-side away">
        <div class="team-name-label">RIVAL</div>
        <input class="score-in" type="number" min="0" id="score-away" placeholder="—" oninput="saveScore()">
      </div>
    </div>
    <input class="rival-in" type="text" id="rival-name" placeholder="Nombre del rival..." oninput="saveScore()">
    <textarea class="nota-in" id="j-nota" placeholder="Notas: cancha, hora, árbitro..." oninput="saveNota()"></textarea>
    <div id="result-badge-wrap"></div>
  </div>

  <div class="section-label">Asistencia &amp; Estadísticas</div>
  <table class="stats-table">
    <thead>
      <tr>
        <th>Jugador</th>
        <th title="Asistió">Asistió</th>
        <th title="Pagó cuota">Pagó</th>
        <th>Goles</th>
        <th title="Tarjetas amarillas">🟨</th>
        <th title="Tarjetas rojas">🟥</th>
      </tr>
    </thead>
    <tbody id="players-tbody"></tbody>
  </table>
  <div class="totales-bar" id="totales-bar"></div>
</div>

<!-- TABLA -->
<div id="tab-tabla" class="section">
  <div class="metrics-grid" id="metrics-grid"></div>
  <div class="section-label">Ranking de jugadores</div>
  <table class="stats-table">
    <thead>
      <tr>
        <th>#</th>
        <th style="text-align:left">Jugador</th>
        <th>PJ</th>
        <th>Asist.</th>
        <th>Pagos</th>
        <th>Goles</th>
        <th>🟨</th>
        <th>🟥</th>
      </tr>
    </thead>
    <tbody id="tabla-tbody"></tbody>
  </table>
</div>

<!-- PLANTEL -->
<div id="tab-plantel" class="section">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <div class="section-label" style="margin:0">Plantel activo</div>
    <button class="btn" onclick="addPlayer()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Agregar
    </button>
  </div>
  <table class="stats-table">
    <thead>
      <tr><th>#</th><th style="text-align:left">Nombre</th><th>Posición</th><th>Estado</th><th></th></tr>
    </thead>
    <tbody id="plantel-tbody"></tbody>
  </table>
</div>

<!-- HISTORIAL -->
<div id="tab-historial" class="section">
  <div class="section-label">Todas las jornadas</div>
  <div id="historial-list"></div>
</div>

</main>

<script>
const POSITIONS = ['Portero','Defensa','Mediocampista','Delantero','Polivalente'];
const STORAGE_KEY = 'masc_futbol7_v1';

function loadState(){
  try{const s=localStorage.getItem(STORAGE_KEY);if(s)return JSON.parse(s);}catch(e){}
  return null;
}

function saveState(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));showSave();}catch(e){}
}

let state = loadState() || {
  currentJornada: 0,
  players: [
    {id:1,name:'Luis',position:'Polivalente',active:true},
    {id:2,name:'Abraham',position:'Polivalente',active:true},
    {id:3,name:'Chisthian',position:'Polivalente',active:true},
    {id:4,name:'Armando',position:'Polivalente',active:true},
    {id:5,name:'Brandon',position:'Polivalente',active:true},
    {id:6,name:'Chuy',position:'Polivalente',active:true},
    {id:7,name:'Jese',position:'Polivalente',active:true},
    {id:8,name:'Martín',position:'Polivalente',active:true},
    {id:9,name:'Jorge',position:'Polivalente',active:true},
    {id:10,name:'Saúl',position:'Polivalente',active:true},
    {id:11,name:'Sahid',position:'Polivalente',active:true},
    {id:12,name:'Solo',position:'Polivalente',active:true}
  ],
  jornadas: [{
    num:1,
    fecha:'Domingo 24 de mayo 2025',
    rival:'',scoreHome:'',scoreAway:'',nota:'',stats:{}
  }]
};

function getJ(){return state.jornadas[state.currentJornada];}

function initStats(j){
  state.players.forEach(p=>{
    if(!j.stats[p.id]) j.stats[p.id]={asistio:false,pago:false,goles:0,amarillas:0,rojas:0};
  });
}

let saveTimer;
function showSave(){
  const dot=document.getElementById('save-dot');
  if(dot){dot.classList.add('show');clearTimeout(saveTimer);saveTimer=setTimeout(()=>dot.classList.remove('show'),1500);}
}

function showTab(t,btn){
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  if(btn)btn.classList.add('active');
  document.getElementById('tab-'+t).classList.add('active');
  if(t==='tabla')renderTabla();
  if(t==='plantel')renderPlantel();
  if(t==='historial')renderHistorial();
}

function prevJ(){if(state.currentJornada>0){state.currentJornada--;renderJornada();}}
function nextJ(){if(state.currentJornada<state.jornadas.length-1){state.currentJornada++;renderJornada();}}

function addJornada(){
  const n=state.jornadas.length+1;
  const now=new Date();
  const days=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const months=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const fecha=days[now.getDay()]+' '+now.getDate()+' de '+months[now.getMonth()]+' '+now.getFullYear();
  state.jornadas.push({num:n,fecha,rival:'',scoreHome:'',scoreAway:'',nota:'',stats:{}});
  state.currentJornada=state.jornadas.length-1;
  saveState();renderJornada();
}

function saveScore(){
  const j=getJ();
  j.scoreHome=document.getElementById('score-home').value;
  j.scoreAway=document.getElementById('score-away').value;
  j.rival=document.getElementById('rival-name').value;
  updateResultBadge(j);
  saveState();
}
function saveNota(){getJ().nota=document.getElementById('j-nota').value;saveState();}

function updateResultBadge(j){
  const wrap=document.getElementById('result-badge-wrap');
  if(!wrap)return;
  const sh=parseInt(j.scoreHome),sa=parseInt(j.scoreAway);
  if(j.scoreHome===''||j.scoreAway===''){wrap.innerHTML='';return;}
  if(sh>sa) wrap.innerHTML='<span class="result-badge rb-win">VICTORIA</span>';
  else if(sh===sa) wrap.innerHTML='<span class="result-badge rb-draw">EMPATE</span>';
  else wrap.innerHTML='<span class="result-badge rb-loss">DERROTA</span>';
}

function toggleStat(pid,field){
  const j=getJ();initStats(j);
  j.stats[pid][field]=!j.stats[pid][field];
  const btn=document.querySelector(`[data-tog="${pid}-${field}"]`);
  if(btn){btn.className='tog '+(j.stats[pid][field]?'on':'off');}
  updateTotales();saveState();
}

function setStat(pid,field,val){
  const j=getJ();initStats(j);
  j.stats[pid][field]=Math.max(0,parseInt(val)||0);
  updateTotales();saveState();
}

function updateTotales(){
  const j=getJ();initStats(j);
  let asist=0,pagos=0,goles=0;
  state.players.forEach(p=>{const s=j.stats[p.id];if(s.asistio)asist++;if(s.pago)pagos++;goles+=s.goles;});
  document.getElementById('totales-bar').innerHTML=`
    <span class="tot-item"><span class="tot-dot" style="background:var(--green)"></span>${asist} asistentes</span>
    <span class="tot-item"><span class="tot-dot" style="background:var(--yellow)"></span>${pagos} pagaron</span>
    <span class="tot-item"><span class="tot-dot" style="background:#fff"></span>${goles} goles</span>
  `;
}

function renderJornada(){
  const j=getJ();initStats(j);
  document.getElementById('j-num').textContent='JORNADA '+j.num;
  document.getElementById('j-date').textContent=j.fecha;
  document.getElementById('score-home').value=j.scoreHome;
  document.getElementById('score-away').value=j.scoreAway;
  document.getElementById('rival-name').value=j.rival||'';
  document.getElementById('j-nota').value=j.nota||'';
  updateResultBadge(j);
  const tbody=document.getElementById('players-tbody');
  tbody.innerHTML='';
  state.players.filter(p=>p.active).forEach(p=>{
    const s=j.stats[p.id];
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td><div class="player-cell"><div class="avatar">${p.name.slice(0,2).toUpperCase()}</div><span class="player-name">${p.name}</span></div></td>
      <td><button class="tog ${s.asistio?'on':'off'}" data-tog="${p.id}-asistio" onclick="toggleStat(${p.id},'asistio')"></button></td>
      <td><button class="tog ${s.pago?'on':'off'}" data-tog="${p.id}-pago" onclick="toggleStat(${p.id},'pago')"></button></td>
      <td><input class="num-in" type="number" min="0" value="${s.goles}" oninput="setStat(${p.id},'goles',this.value)"></td>
      <td><input class="num-in" type="number" min="0" value="${s.amarillas}" oninput="setStat(${p.id},'amarillas',this.value)"></td>
      <td><input class="num-in" type="number" min="0" value="${s.rojas}" oninput="setStat(${p.id},'rojas',this.value)"></td>
    `;
    tbody.appendChild(tr);
  });
  updateTotales();
}

function renderTabla(){
  let wins=0,draws=0,losses=0,totalGoles=0,totalPagos=0;
  const acc={};
  state.players.forEach(p=>{acc[p.id]={name:p.name,pj:0,asistencias:0,pagos:0,goles:0,amarillas:0,rojas:0};});
  state.jornadas.forEach(j=>{
    initStats(j);
    const sh=parseInt(j.scoreHome),sa=parseInt(j.scoreAway);
    if(j.scoreHome!==''&&j.scoreAway!==''){if(sh>sa)wins++;else if(sh===sa)draws++;else losses++;}
    state.players.forEach(p=>{
      const s=j.stats[p.id];if(!s)return;
      acc[p.id].pj++;
      if(s.asistio)acc[p.id].asistencias++;
      if(s.pago){acc[p.id].pagos++;totalPagos++;}
      acc[p.id].goles+=s.goles;totalGoles+=s.goles;
      acc[p.id].amarillas+=s.amarillas;
      acc[p.id].rojas+=s.rojas;
    });
  });
  document.getElementById('metrics-grid').innerHTML=`
    <div class="metric-card"><div class="metric-val">${state.jornadas.length}</div><div class="metric-label">Jornadas</div></div>
    <div class="metric-card"><div class="metric-val green">${wins}</div><div class="metric-label">Victorias</div></div>
    <div class="metric-card"><div class="metric-val">${draws}</div><div class="metric-label">Empates</div></div>
    <div class="metric-card"><div class="metric-val red">${losses}</div><div class="metric-label">Derrotas</div></div>
    <div class="metric-card"><div class="metric-val">${totalGoles}</div><div class="metric-label">Goles</div></div>
    <div class="metric-card"><div class="metric-val">${totalPagos}</div><div class="metric-label">Pagos</div></div>
  `;
  const sorted=Object.values(acc).sort((a,b)=>b.goles-a.goles||b.asistencias-a.asistencias);
  const tbody=document.getElementById('tabla-tbody');
  tbody.innerHTML='';
  sorted.forEach((s,i)=>{
    const tr=document.createElement('tr');
    const isTop=i<3;
    tr.innerHTML=`
      <td><span class="rank-num ${isTop?'top':''}">${i+1}</span></td>
      <td><div class="player-cell"><div class="avatar">${s.name.slice(0,2).toUpperCase()}</div><span class="player-name">${s.name}</span></div></td>
      <td>${s.pj}</td>
      <td>${s.asistencias}</td>
      <td>${s.pagos}</td>
      <td style="font-weight:600;color:${s.goles>0?'var(--green)':'inherit'}">${s.goles}</td>
      <td>${s.amarillas>0?`<span style="color:var(--yellow);font-weight:600">${s.amarillas}</span>`:'—'}</td>
      <td>${s.rojas>0?`<span style="color:var(--red);font-weight:600">${s.rojas}</span>`:'—'}</td>
    `;
    tbody.appendChild(tr);
  });
}

function renderPlantel(){
  const tbody=document.getElementById('plantel-tbody');
  tbody.innerHTML='';
  state.players.forEach((p,i)=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td style="color:var(--text3);font-size:12px">${i+1}</td>
      <td>
        <div class="player-cell">
          <div class="avatar">${p.name.slice(0,2).toUpperCase()}</div>
          <input class="name-edit" value="${p.name}" onchange="renamePlayer(${i},this.value)">
        </div>
      </td>
      <td>
        <select class="pos-select" onchange="state.players[${i}].position=this.value;saveState()">
          ${POSITIONS.map(pos=>`<option${p.position===pos?' selected':''}>${pos}</option>`).join('')}
        </select>
      </td>
      <td><span class="status-badge ${p.active?'sb-active':'sb-inactive'}">${p.active?'Activo':'Baja'}</span></td>
      <td><button class="btn" style="font-size:12px;padding:5px 10px" onclick="togglePlayer(${i})">${p.active?'Dar de baja':'Reactivar'}</button></td>
    `;
    tbody.appendChild(tr);
  });
}

function renamePlayer(i,name){
  if(name.trim()){state.players[i].name=name.trim();saveState();renderJornada();}
}
function togglePlayer(i){state.players[i].active=!state.players[i].active;saveState();renderPlantel();renderJornada();}

function addPlayer(){
  const name=prompt('Nombre del jugador:');
  if(name&&name.trim()){
    const id=Date.now();
    state.players.push({id,name:name.trim(),position:'Polivalente',active:true});
    state.jornadas.forEach(j=>{j.stats[id]={asistio:false,pago:false,goles:0,amarillas:0,rojas:0};});
    saveState();renderPlantel();renderJornada();
  }
}

function renderHistorial(){
  const div=document.getElementById('historial-list');
  if(!state.jornadas.length){div.innerHTML='<div class="empty-state">No hay jornadas registradas.</div>';return;}
  div.innerHTML='';
  [...state.jornadas].reverse().forEach(j=>{
    initStats(j);
    let asist=0,goles=0,pagos=0;
    state.players.forEach(p=>{const s=j.stats[p.id];if(s.asistio)asist++;goles+=s.goles;if(s.pago)pagos++;});
    const sh=parseInt(j.scoreHome),sa=parseInt(j.scoreAway);
    let badge='';
    if(j.scoreHome!==''&&j.scoreAway!==''){
      if(sh>sa)badge='<span class="result-badge rb-win">VICTORIA</span>';
      else if(sh===sa)badge='<span class="result-badge rb-draw">EMPATE</span>';
      else badge='<span class="result-badge rb-loss">DERROTA</span>';
    }
    const card=document.createElement('div');
    card.className='h-card';
    card.innerHTML=`
      <div class="h-top">
        <span class="h-jnum">JORNADA ${j.num}</span>
        ${badge||'<span class="result-badge rb-draw" style="opacity:.4">SIN RESULTADO</span>'}
      </div>
      <div class="h-date">${j.fecha}${j.rival?' · vs '+j.rival:''}</div>
      ${j.scoreHome!==''?`<div class="h-score">${j.scoreHome} – ${j.scoreAway}</div>`:''}
      <div class="h-meta">
        <span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
          ${asist} jugadores
        </span>
        <span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
          ${goles} goles
        </span>
        <span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          ${pagos} pagaron
        </span>
      </div>
      ${j.nota?`<div style="font-size:12px;color:var(--text3);margin-top:8px;font-style:italic">${j.nota}</div>`:''}
    `;
    card.onclick=()=>{
      state.currentJornada=state.jornadas.indexOf(j);
      document.querySelectorAll('.nav-btn').forEach((b,i)=>{b.classList.toggle('active',i===0);});
      document.querySelectorAll('.section').forEach((s,i)=>{s.classList.toggle('active',i===0);});
      renderJornada();
    };
    div.appendChild(card);
  });
}

// Save indicator in header
document.getElementById('header-meta').innerHTML='Temporada 2025 <span id="save-dot" class="save-dot"></span>';

// Init
renderJornada();
</script>
</body>
</html>
